services:
  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4223:4222"
      - "8223:8222"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: subway
      POSTGRES_PASSWORD: subway
      POSTGRES_DB: subway_ledger
    ports:
      - "5433:5432"
    volumes:
      - subway_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subway -d subway_ledger"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 5s

volumes:
  subway_pg:
